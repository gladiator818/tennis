[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-performance-analytics"
version = "0.1.0"
description = "Coach-ready ATP Top-100 strengths/weaknesses reporting pipeline"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1",
  "duckdb>=1.1",
  "pydantic>=2.6",
  "typer>=0.12",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tennis-analytics = "tennis_analytics.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
